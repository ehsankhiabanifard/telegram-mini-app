<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>ویترین فروشگاه</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        /* =========================
           DARK LUXURY THEME
        ========================= */

        :root {

            --bg: #0B0B0D;

            --surface: #151519;

            --surface-2: #1C1C21;

            --border: #292930;

            --text: #F5F5F5;

            --muted: #9999A3;

            --accent: #C8A96B;
        }


        body {

            margin: 0;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                var(--bg);

            color:
                var(--text);

            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            padding:
                25px 18px 20px;

            position: sticky;

            top: 0;

            z-index: 10;

            background:
                rgba(11, 11, 13, .88);

            backdrop-filter:
                blur(20px);

            border-bottom:
                1px solid var(--border);
        }


        .brand {

            font-size: 24px;

            font-weight: 800;

            letter-spacing: -.5px;

            text-align: center;

            color:
                var(--text);
        }


        .subtitle {

            margin-top: 7px;

            text-align: center;

            font-size: 12px;

            color:
                var(--muted);

            letter-spacing: .3px;
        }


        /* =========================
           PRODUCTS
        ========================= */

        .products {

            padding: 16px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 14px;
        }


        .product {

            overflow: hidden;

            border-radius: 18px;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease;
        }


        .product:active {

            transform:
                scale(.97);

            border-color:
                var(--accent);
        }


        .product-image {

            width: 100%;

            aspect-ratio: 3 / 4;

            object-fit: cover;

            display: block;
        }


        .product-info {

            padding:
                12px 13px 15px;
        }


        .product-name {

            font-size: 13px;

            font-weight: 700;

            line-height: 1.7;

            color:
                var(--text);
        }


        .view {

            margin-top: 5px;

            font-size: 11px;

            color:
                var(--accent);
        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            position: fixed;

            inset: 0;

            z-index: 100;

            background:
                rgba(0, 0, 0, .88);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 12px;
        }


        .modal.active {

            display: flex;
        }


        .modal-box {

            width: 100%;

            max-width: 500px;

            max-height: 94vh;

            overflow-y: auto;

            border-radius: 24px;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            box-shadow:
                0 30px 100px rgba(0,0,0,.7);

            overflow: hidden;
        }


        /* =========================
           GALLERY
        ========================= */

        .gallery {

            position: relative;

            background:
                #050506;
        }


        .gallery img {

            width: 100%;

            aspect-ratio: 3 / 4;

            object-fit: cover;

            display: block;
        }


        /* CLOSE */

        .close {

            position: absolute;

            top: 12px;

            right: 12px;

            width: 38px;

            height: 38px;

            border:
                1px solid rgba(255,255,255,.15);

            border-radius: 50%;

            background:
                rgba(0,0,0,.65);

            color:
                white;

            font-size: 22px;

            z-index: 5;

            cursor: pointer;
        }


        /* ARROWS */

        .arrow {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            width: 42px;

            height: 42px;

            border:
                1px solid rgba(255,255,255,.12);

            border-radius: 50%;

            background:
                rgba(0,0,0,.65);

            color:
                white;

            font-size: 22px;

            cursor: pointer;
        }


        .arrow-right {

            right: 10px;
        }


        .arrow-left {

            left: 10px;
        }


        /* COUNTER */

        .counter {

            position: absolute;

            bottom: 12px;

            left: 50%;

            transform:
                translateX(-50%);

            padding:
                5px 11px;

            border-radius:
                20px;

            background:
                rgba(0,0,0,.7);

            color:
                var(--accent);

            font-size: 11px;
        }


        /* =========================
           DETAILS
        ========================= */

        .details {

            padding:
                19px;
        }


        .details h2 {

            margin: 0;

            font-size: 20px;

            color:
                var(--text);
        }


        .details p {

            margin:
                10px 0 20px;

            color:
                var(--muted);

            font-size: 13px;

            line-height: 2;

            white-space:
                pre-line;

            max-height:
                130px;

            overflow-y:
                auto;

            padding-left:
                6px;
        }


        /* =========================
           DESCRIPTION SCROLLBAR
        ========================= */

        .details p::-webkit-scrollbar {

            width: 3px;
        }


        .details p::-webkit-scrollbar-thumb {

            background:
                var(--accent);

            border-radius:
                10px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }


        .action {

            padding:
                13px;

            border-radius:
                14px;

            text-align:
                center;

            text-decoration:
                none;

            color:
                var(--text);

            background:
                var(--surface-2);

            border:
                1px solid var(--border);

            font-size:
                13px;

            font-weight:
                bold;

            transition:
                .2s ease;
        }


        .action:active {

            transform:
                scale(.97);
        }


        .action-map {

            grid-column:
                1 / -1;

            background:
                var(--accent);

            color:
                #111;

            border-color:
                var(--accent);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:340px) {

            .products {

                grid-template-columns:
                    1fr;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="brand">
            ✦ ویترین فروشگاه
        </div>

        <div class="subtitle">
            جدیدترین محصولات
        </div>

    </header>



    <!-- =========================
         PRODUCTS
    ========================= -->

    <main
        class="products"
        id="products">
    </main>



    <!-- =========================
         PRODUCT MODAL
    ========================= -->

    <div
        class="modal"
        id="modal">

        <div class="modal-box">


            <!-- GALLERY -->

            <div class="gallery">


                <button
                    class="close"
                    onclick="closeProduct()">

                    ×

                </button>


                <img
                    id="galleryImage"
                    src=""
                    alt="">


                <button
                    class="arrow arrow-right"
                    onclick="nextImage()">

                    ›
                    
                </button>


                <button
                    class="arrow arrow-left"
                    onclick="previousImage()">

                    ‹

                </button>


                <div
                    class="counter"
                    id="counter">
                </div>


            </div>



            <!-- DETAILS -->

            <div class="details">


                <h2
                    id="productTitle">
                </h2>


                <p
                    id="productDescription">
                </p>



                <div class="actions">


                    <a
                        class="action"
                        href="https://t.me/ehsanfard_dev">

                        💬 مشاوره

                    </a>


                    <a
                        class="action"
                        href="https://wa.me/989124107390">

                        📱 واتساپ

                    </a>


                    <a
                        class="action action-map"
                        href="https://nshn.ir/?destination=35.7208900062934,51.47694936039926&vehicle=d">

                        📍 مسیریابی تا فروشگاه →

                    </a>


                </div>


            </div>


        </div>

    </div>



    <script>


        /* =========================
           TELEGRAM WEB APP
        ========================= */

        const tg =
            window.Telegram?.WebApp;


        if (tg) {

            tg.ready();

            tg.expand();

        }



        /* =========================
           PRODUCTS
        ========================= */

        const products = [


            {
                name: "کد 100",

                description:
                    "باکسی اورسایز چاپ پیش و رو\n\nمناسب سن 10 تا 14 سال\nجنس: با کیفیت\nمدل: آزاد و اورسایز\nاستایل: اسپرت و روزمره",

                images: [

                    "https://raw.githubusercontent.com/ehsankhiabanifard/telegram-mini-app/main/images/IMG-100-0.png",

                    "https://raw.githubusercontent.com/ehsankhiabanifard/telegram-mini-app/main/images/IMG-100-1.png",

                    "https://raw.githubusercontent.com/ehsankhiabanifard/telegram-mini-app/main/images/IMG-100-2.png",

                    "https://raw.githubusercontent.com/ehsankhiabanifard/telegram-mini-app/main/images/IMG-100-3.png",

                    "https://raw.githubusercontent.com/ehsankhiabanifard/telegram-mini-app/main/images/IMG-100-4.png"

                ]

            },


            {
                name: "محصول دوم",

                description:
                    "توضیحات محصول دوم",

                images: [

                    "https://picsum.photos/700/900?random=2",

                    "https://picsum.photos/700/900?random=12",

                    "https://picsum.photos/700/900?random=22"

                ]

            },


            {
                name: "محصول سوم",

                description:
                    "توضیحات محصول سوم",

                images: [

                    "https://picsum.photos/700/900?random=3",

                    "https://picsum.photos/700/900?random=13",

                    "https://picsum.photos/700/900?random=23"

                ]

            },


            {
                name: "محصول چهارم",

                description:
                    "توضیحات محصول چهارم",

                images: [

                    "https://picsum.photos/700/900?random=4",

                    "https://picsum.photos/700/900?random=14",

                    "https://picsum.photos/700/900?random=24"

                ]

            },


            {
                name: "محصول پنجم",

                description:
                    "توضیحات محصول پنجم",

                images: [

                    "https://picsum.photos/700/900?random=5",

                    "https://picsum.photos/700/900?random=15",

                    "https://picsum.photos/700/900?random=25"

                ]

            },


            {
                name: "محصول ششم",

                description:
                    "توضیحات محصول ششم",

                images: [

                    "https://picsum.photos/700/900?random=6",

                    "https://picsum.photos/700/900?random=16",

                    "https://picsum.photos/700/900?random=26"

                ]

            },


            {
                name: "محصول هفتم",

                description:
                    "توضیحات محصول هفتم",

                images: [

                    "https://picsum.photos/700/900?random=7",

                    "https://picsum.photos/700/900?random=17",

                    "https://picsum.photos/700/900?random=27"

                ]

            },


            {
                name: "محصول هشتم",

                description:
                    "توضیحات محصول هشتم",

                images: [

                    "https://picsum.photos/700/900?random=8",

                    "https://picsum.photos/700/900?random=18",

                    "https://picsum.photos/700/900?random=28"

                ]

            },


            {
                name: "محصول نهم",

                description:
                    "توضیحات محصول نهم",

                images: [

                    "https://picsum.photos/700/900?random=9",

                    "https://picsum.photos/700/900?random=19",

                    "https://picsum.photos/700/900?random=29"

                ]

            },


            {
                name: "محصول دهم",

                description:
                    "توضیحات محصول دهم",

                images: [

                    "https://picsum.photos/700/900?random=10",

                    "https://picsum.photos/700/900?random=20",

                    "https://picsum.photos/700/900?random=30"

                ]

            }

        ];



        /* =========================
           RENDER PRODUCTS
        ========================= */

        const productsContainer =
            document.getElementById(
                "products"
            );


        products.forEach(
            (product, index) => {


                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "product";


                card.innerHTML = `

                    <img
                        class="product-image"
                        src="${product.images[0]}"
                        alt="${product.name}">

                    <div class="product-info">

                        <div class="product-name">
                            ${product.name}
                        </div>

                        <div class="view">
                            مشاهده تصاویر ←
                        </div>

                    </div>

                `;


                card.onclick = () => {

                    openProduct(index);

                };


                productsContainer.appendChild(
                    card
                );

            }
        );



        /* =========================
           GALLERY VARIABLES
        ========================= */

        let currentProduct = 0;

        let currentImage = 0;


        const modal =
            document.getElementById(
                "modal"
            );


        const galleryImage =
            document.getElementById(
                "galleryImage"
            );


        const productTitle =
            document.getElementById(
                "productTitle"
            );


        const productDescription =
            document.getElementById(
                "productDescription"
            );


        const counter =
            document.getElementById(
                "counter"
            );



        /* =========================
           OPEN PRODUCT
        ========================= */

        function openProduct(index) {

            currentProduct =
                index;

            currentImage =
                0;

            updateGallery();

            modal.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";
        }



        /* =========================
           UPDATE GALLERY
        ========================= */

        function updateGallery() {

            const product =
                products[
                    currentProduct
                ];


            galleryImage.src =
                product.images[
                    currentImage
                ];


            productTitle.textContent =
                product.name;


            productDescription.textContent =
                product.description;


            counter.textContent =
                `${currentImage + 1} / ${product.images.length}`;

        }



        /* =========================
           NEXT IMAGE
        ========================= */

        function nextImage() {

            const product =
                products[
                    currentProduct
                ];


            currentImage++;


            if (
                currentImage >=
                product.images.length
            ) {

                currentImage = 0;

            }


            updateGallery();

        }



        /* =========================
           PREVIOUS IMAGE
        ========================= */

        function previousImage() {

            const product =
                products[
                    currentProduct
                ];


            currentImage--;


            if (
                currentImage < 0
            ) {

                currentImage =
                    product.images.length - 1;

            }


            updateGallery();

        }



        /* =========================
           CLOSE PRODUCT
        ========================= */

        function closeProduct() {

            modal.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

        }



        /* =========================
           CLOSE BY BACKGROUND
        ========================= */

        modal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === modal
                ) {

                    closeProduct();

                }

            }
        );


    </script>

</body>

</html>
