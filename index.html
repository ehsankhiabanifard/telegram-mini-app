<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>ویترین تولید و پخش آرمان</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;

            background:
                var(--tg-theme-bg-color, #101114);

            color:
                var(--tg-theme-text-color, #ffffff);

            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            padding: 22px 18px 16px;

            position: sticky;
            top: 0;

            z-index: 10;

            background:
                color-mix(
                    in srgb,
                    var(--tg-theme-bg-color, #101114) 88%,
                    transparent
                );

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid
                var(--tg-theme-hint-color, #777);
        }

        .brand {
            font-size: 24px;
            font-weight: 800;

            text-align: center;
        }

        .subtitle {
            margin-top: 6px;

            text-align: center;

            font-size: 12px;

            color:
                var(--tg-theme-hint-color, #a0a0a0);
        }


        /* =========================
           PRODUCTS
        ========================= */

        .products {

            padding: 16px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 13px;
        }


        .product {

            overflow: hidden;

            border-radius: 20px;

            background:
                var(--tg-theme-secondary-bg-color, #1b1c20);

            border:
                1px solid
                rgba(255,255,255,.07);

            cursor: pointer;

            transition:
                transform .18s ease,
                box-shadow .18s ease;
        }

        .product:active {

            transform: scale(.96);
        }


        .product-image {

            width: 100%;

            aspect-ratio: 3 / 4;

            object-fit: cover;

            display: block;
        }


        .product-info {

            padding: 11px 12px 14px;
        }


        .product-name {

            font-size: 13px;

            font-weight: 700;

            line-height: 1.7;
        }


        .view {

            margin-top: 4px;

            font-size: 11px;

            color:
                var(--tg-theme-link-color, #5ea7ff);
        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            position: fixed;

            inset: 0;

            z-index: 100;

            background:
                rgba(0,0,0,.82);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 14px;
        }


        .modal.active {

            display: flex;
        }


        .modal-box {

            width: 100%;

            max-width: 500px;

            max-height: 94vh;

            overflow-y: auto;

            border-radius: 25px;

            background:
                var(--tg-theme-bg-color, #101114);

            box-shadow:
                0 25px 80px rgba(0,0,0,.5);

            overflow: hidden;
        }


        /* =========================
           GALLERY
        ========================= */

        .gallery {

            position: relative;

            background: #080808;
        }


        .gallery img {

            width: 100%;

            aspect-ratio: 3 / 4;

            object-fit: cover;

            display: block;
        }


        .close {

            position: absolute;

            top: 12px;

            right: 12px;

            width: 38px;

            height: 38px;

            border: none;

            border-radius: 50%;

            background:
                rgba(0,0,0,.6);

            color: white;

            font-size: 22px;

            z-index: 5;
        }


        .arrow {

            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 50%;

            background:
                rgba(0,0,0,.55);

            color: white;

            font-size: 22px;
        }


        .arrow-right {

            right: 10px;
        }


        .arrow-left {

            left: 10px;
        }


        .counter {

            position: absolute;

            bottom: 12px;

            left: 50%;

            transform: translateX(-50%);

            padding: 5px 10px;

            border-radius: 20px;

            background:
                rgba(0,0,0,.55);

            font-size: 11px;
        }


        /* =========================
           DETAILS
        ========================= */

        .details {

            padding: 18px;
        }


        .details h2 {

            margin: 0;

            font-size: 20px;
        }


        .details p {

            margin:
                8px 0 18px;

            color:
                var(--tg-theme-hint-color, #aaa);

            font-size: 13px;

            line-height: 1.9;
        }


        .actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }


        .action {

            padding: 13px;

            border-radius: 15px;

            text-align: center;

            text-decoration: none;

            color: white;

            background:
                var(--tg-theme-secondary-bg-color, #222);

            font-size: 13px;

            font-weight: bold;
        }


        .action-map {

            grid-column: 1 / -1;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #ec4899
                );
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:340px) {

            .products {

                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="brand">
        ✦ ویترین تولید و پخش اشکان
    </div>

    <div class="subtitle">
       کالکشن پاییزه
    </div>

</header>



<!-- =========================
     PRODUCTS
========================= -->

<main class="products" id="products"></main>



<!-- =========================
     PRODUCT MODAL
========================= -->

<div class="modal" id="modal">

    <div class="modal-box">

        <div class="gallery">

            <button
                class="close"
                onclick="closeProduct()">
                ×
            </button>


            <img
                id="galleryImage"
                src=""
                alt="">


            <button
                class="arrow arrow-right"
                onclick="nextImage()">
                ›
            </button>


            <button
                class="arrow arrow-left"
                onclick="previousImage()">
                ‹
            </button>


            <div
                class="counter"
                id="counter">
            </div>

        </div>


        <div class="details">

            <h2 id="productTitle"></h2>

            <p id="productDescription"></p>


            <div class="actions">
            </div>

        </div>

    </div>

</div>



<script>

    /* =========================
       TELEGRAM
    ========================= */

    const tg = window.Telegram?.WebApp;

    if (tg) {

        tg.ready();

        tg.expand();

    }



    /* =========================
       PRODUCTS DATA
    ========================= */

    const products = [

        {
            name: "کد 100",
            description: "مدل جدید با استایل آزاد و مدرن.",
            images: [
                "images/product-01/IMG-100-0.png",
                "images/product-01/IMG-100-1.png",
                "images/product-01/IMG-100-2.png"
                "images/product-01/IMG-100-3.png"
                "images/product-01/IMG-100-4.png"
            ]
        },

        {
            name: "ست پاییزی دخترانه",
            description: "استایل پاییزی با طراحی مدرن.",
            images: [
                "https://picsum.photos/700/900?random=2",
                "https://picsum.photos/700/900?random=12",
                "https://picsum.photos/700/900?random=22"
            ]
        },

        {
            name: "هودی اورسایز",
            description: "طراحی راحت و مناسب استایل روزمره.",
            images: [
                "https://picsum.photos/700/900?random=3",
                "https://picsum.photos/700/900?random=13",
                "https://picsum.photos/700/900?random=23"
            ]
        },

        {
            name: "ست اسپرت پسرانه",
            description: "استایل اسپرت مناسب نوجوانان.",
            images: [
                "https://picsum.photos/700/900?random=4",
                "https://picsum.photos/700/900?random=14",
                "https://picsum.photos/700/900?random=24"
            ]
        },

        {
            name: "دامن بافت",
            description: "بافت ظریف با استایل پاییزی.",
            images: [
                "https://picsum.photos/700/900?random=5",
                "https://picsum.photos/700/900?random=15",
                "https://picsum.photos/700/900?random=25"
            ]
        },

        {
            name: "شلوار بگی",
            description: "فرم آزاد و ترند برای استایل خیابانی.",
            images: [
                "https://picsum.photos/700/900?random=6",
                "https://picsum.photos/700/900?random=16",
                "https://picsum.photos/700/900?random=26"
            ]
        },

        {
            name: "تیشرت باکسی",
            description: "مدل مینیمال با فرم آزاد.",
            images: [
                "https://picsum.photos/700/900?random=7",
                "https://picsum.photos/700/900?random=17",
                "https://picsum.photos/700/900?random=27"
            ]
        },

        {
            name: "کت پاییزی",
            description: "استایل شیک مناسب فصل پاییز.",
            images: [
                "https://picsum.photos/700/900?random=8",
                "https://picsum.photos/700/900?random=18",
                "https://picsum.photos/700/900?random=28"
            ]
        },

        {
            name: "بافت دخترانه",
            description: "طراحی ظریف و مناسب استایل روزمره.",
            images: [
                "https://picsum.photos/700/900?random=9",
                "https://picsum.photos/700/900?random=19",
                "https://picsum.photos/700/900?random=29"
            ]
        },

        {
            name: "ست راحتی",
            description: "استایل راحت و مدرن برای استفاده روزمره.",
            images: [
                "https://picsum.photos/700/900?random=10",
                "https://picsum.photos/700/900?random=20",
                "https://picsum.photos/700/900?random=30"
            ]
        }

    ];



    /* =========================
       RENDER PRODUCTS
    ========================= */

    const productsContainer =
        document.getElementById("products");


    products.forEach((product, index) => {

        const card =
            document.createElement("article");

        card.className = "product";


        card.innerHTML = `

            <img
                class="product-image"
                src="${product.images[0]}"
                alt="${product.name}">

            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="view">
                    مشاهده تصاویر ←
                </div>

            </div>

        `;


        card.onclick = () => {

            openProduct(index);

        };


        productsContainer.appendChild(card);

    });



    /* =========================
       GALLERY
    ========================= */

    let currentProduct = 0;

    let currentImage = 0;


    const modal =
        document.getElementById("modal");

    const galleryImage =
        document.getElementById("galleryImage");

    const productTitle =
        document.getElementById("productTitle");

    const productDescription =
        document.getElementById("productDescription");

    const counter =
        document.getElementById("counter");



    function openProduct(index) {

        currentProduct = index;

        currentImage = 0;

        updateGallery();

        modal.classList.add("active");

        document.body.style.overflow = "hidden";

    }



    function updateGallery() {

        const product =
            products[currentProduct];


        galleryImage.src =
            product.images[currentImage];


        productTitle.textContent =
            product.name;


        productDescription.textContent =
            product.description;


        counter.textContent =
            `${currentImage + 1} / ${product.images.length}`;

    }



    function nextImage() {

        const product =
            products[currentProduct];


        currentImage++;


        if (
            currentImage >=
            product.images.length
        ) {

            currentImage = 0;

        }


        updateGallery();

    }



    function previousImage() {

        const product =
            products[currentProduct];


        currentImage--;


        if (currentImage < 0) {

            currentImage =
                product.images.length - 1;

        }


        updateGallery();

    }



    function closeProduct() {

        modal.classList.remove("active");

        document.body.style.overflow = "";

    }



    /* =========================
       CLOSE BY BACKGROUND
    ========================= */

    modal.addEventListener(
        "click",
        function(event) {

            if (
                event.target === modal
            ) {

                closeProduct();

            }

        }
    );


</script>

</body>
</html>
