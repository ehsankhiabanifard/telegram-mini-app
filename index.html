<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>ویترین پوشاک اشکان</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Main CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="store-header">

            <div class="header-content">

                <div class="brand">
                    <h1 id="storeTitle">ویترین پوشاک اشکان</h1>
                    <p id="storeSubtitle">
                        مجموعه‌ای از جدیدترین مدل‌های پاییزی با کیفیت عالی
                    </p>
                </div>

            </div>

        </header>


        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <span>در حال بارگذاری محصولات...</span>
        </div>


        <!-- Error -->
        <div id="errorMessage" class="error-message hidden">
            <div class="error-icon">!</div>

            <h3>خطا در بارگذاری</h3>

            <p>
                اطلاعات محصولات دریافت نشد.
                لطفاً اتصال اینترنت را بررسی کرده و دوباره تلاش کنید.
            </p>

            <button id="retryButton" class="retry-button">
                تلاش مجدد
            </button>
        </div>


        <!-- Products -->
        <main
            id="productsGrid"
            class="products-grid"
            aria-live="polite"
        ></main>

    </div>


    <!-- Gallery Modal -->
    <div
        id="galleryModal"
        class="modal-overlay hidden"
        role="dialog"
        aria-modal="true"
        aria-label="گالری تصاویر محصول"
    >

        <div class="gallery-modal">

            <button
                id="galleryClose"
                class="modal-close"
                type="button"
                aria-label="بستن"
            >
                ×
            </button>


            <button
                id="galleryPrev"
                class="gallery-arrow gallery-prev"
                type="button"
                aria-label="تصویر قبلی"
            >
                ‹
            </button>


            <div class="gallery-content">

                <div class="gallery-image-wrapper">

                    <img
                        id="galleryImage"
                        class="gallery-image"
                        src=""
                        alt=""
                    >

                </div>


                <div class="gallery-info">

                    <h2 id="galleryTitle"></h2>

                    <p id="galleryDescription"></p>

                    <div
                        id="galleryCounter"
                        class="gallery-counter"
                    >
                        1 / 1
                    </
