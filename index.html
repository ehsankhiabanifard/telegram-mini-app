<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <title>ویترین پوشاک اشکان</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0B0B0D;
            --surface: #151519;
            --surface-2: #1C1C21;
            --border: #292930;
            --text: #F5F5F5;
            --muted: #9999A3;
            --accent: #C8A96B;
            --accent-dark: #9F824C;
            --danger: #D96C6C;
        }

        html {
            background: var(--bg);
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(
                    circle at top right,
                    rgba(200, 169, 107, 0.07),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                "Markazi Text",
                Tahoma,
                Arial,
                sans-serif;

            min-height: 100vh;

            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font-family: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           Header
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 20;

            width: 100%;

            padding: 20px 16px 18px;

            background: rgba(11, 11, 13, 0.94);

            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            text-align: center;
        }

        .header-title {
            color: var(--accent);

            font-size: 26px;
            font-weight: 700;

            line-height: 1.5;

            letter-spacing: 0.3px;

            margin-bottom: 5px;
        }

        .header-subtitle {
            color: var(--muted);

            font-size: 16px;
            font-weight: 500;

            line-height: 1.8;
        }

        /* =========================
           Products
        ========================= */

        .products {
            width: 100%;
            max-width: 1400px;

            margin: 0 auto;
            padding: 18px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 14px;
        }

        .product {
            min-width: 0;
            overflow: hidden;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: 14px;

            display: flex;
            flex-direction: column;

            transition:
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .product:active {
            transform: scale(0.99);
        }

        /* =========================
           Product Image
        ========================= */

        .product-image {
            width: 100%;

            aspect-ratio: 3 / 4;

            object-fit: cover;

            display: block;

            background: var(--surface-2);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .product-image:active {
            transform: scale(0.985);
            opacity: 0.9;
        }

        /* =========================
           Product Info
        ========================= */

        .product-info {
            padding: 14px;

            display: flex;
            flex: 1;
            flex-direction: column;
        }

        .product-name {
            color: var(--text);

            font-size: 16px;
            font-weight: 700;

            line-height: 1.8;

            margin-bottom: 8px;

            overflow-wrap: anywhere;
        }

        .product-description {
            color: var(--muted);

            font-size: 13px;
            font-weight: 500;

            line-height: 1.9;

            margin-bottom: 14px;
        }

        /* =========================
           Product Buttons
        ========================= */

        .product-actions {
            display: flex;
            flex-direction: column;

            gap: 8px;

            margin-top: auto;
        }

        .product-button {
            width: 100%;

            min-height: 44px;

            padding: 9px 8px;

            border: 1px solid var(--border);
            border-radius: 9px;

            background: var(--surface-2);
            color: var(--text);

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            white-space: nowrap;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.15s ease;
        }

        .product-button.gallery-button {
            color: var(--accent);

            border-color:
                rgba(200, 169, 107, 0.4);
        }

        .product-button.details-button {
            background: var(--accent);

            color: #151515;

            border-color: var(--accent);
        }

        .product-button:active {
            transform: scale(0.98);
        }

        /* =========================
           Overlay
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;
            justify-content: center;

            padding:
                20px
                max(20px, env(safe-area-inset-right))
                20px
                max(20px, env(safe-area-inset-left));

            background: rgba(0, 0, 0, 0.82);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .overlay.active {
            display: flex;
        }

        /* =========================
           Gallery
        ========================= */

        .gallery-modal {
            position: relative;

            width: 100%;
            max-width: 520px;

            max-height: 94vh;

            overflow: hidden;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: 16px;

            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            padding: 14px 16px;

            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            color: var(--accent);

            font-size: 18px;
            font-weight: 700;

            line-height: 1.7;
        }

        .close-button {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            border: 1px solid var(--border);
            border-radius: 50%;

            background: var(--surface-2);

            color: var(--text);

            font-family: Arial, sans-serif;

            font-size: 20px;
            line-height: 1;

            cursor: pointer;
        }

        .gallery-content {
            position: relative;

            padding: 12px;

            overflow: hidden;
        }

        .gallery-image {
            display: block;

            width: 100%;

            max-height: 65vh;

            object-fit: contain;

            border-radius: 10px;

            background: #101014;
        }

        .gallery-arrow {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 38px;
            height: 38px;

            border: 1px solid
                rgba(255, 255, 255, 0.2);

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 24px;
            line-height: 1;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .gallery-arrow.previous {
            right: 22px;
        }

        .gallery-arrow.next {
            left: 22px;
        }

        .gallery-footer {
            padding: 10px 16px 15px;

            border-top: 1px solid var(--border);

            text-align: center;
        }

        .gallery-counter {
            color: var(--muted);

            font-size: 14px;

            margin-bottom: 8px;
        }

        .gallery-description {
            color: var(--muted);

            font-size: 13px;

            line-height: 1.9;
        }

        /* =========================
           Details
        ========================= */

        .details-modal {
            width: 100%;

            max-width: 540px;

            max-height: 92vh;

            overflow-y: auto;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .details-content {
            padding: 16px;
        }

        .details-description {
            color: var(--muted);

            font-size: 14px;

            line-height: 2;

            margin-bottom: 16px;
        }

        .details-table {
            width: 100%;

            border-collapse: collapse;

            margin-bottom: 18px;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: 10px;
        }

        .details-table tr {
            border-bottom: 1px solid var(--border);
        }

        .details-table tr:last-child {
            border-bottom: none;
        }

        .details-table td {
            padding: 12px 10px;

            font-size: 14px;

            line-height: 1.8;

            vertical-align: top;
        }

        .details-table td:first-child {
            width: 38%;

            color: var(--accent);

            font-weight: 700;

            background:
                rgba(200, 169, 107, 0.05);
        }

        .details-table td:last-child {
            color: var(--text);
        }

        /* =========================
           Contact
        ========================= */

        .contact-title {
            color: var(--accent);

            font-size: 15px;
            font-weight: 700;

            margin-bottom: 10px;
        }

        .contact-buttons {
            display: grid;

            grid-template-columns: 1fr;

            gap: 9px;
        }

        .contact-button {
            width: 100%;

            min-height: 46px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);

            border-radius: 9px;

            background: var(--surface-2);

            color: var(--text);

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .contact-button.telegram {
            color: #65B8E8;

            border-color:
                rgba(101, 184, 232, 0.35);
        }

        .contact-button.whatsapp {
            color: #65D68A;

            border-color:
                rgba(101, 214, 138, 0.35);
        }

        .contact-button.location {
            color: var(--accent);

            border-color:
                rgba(200, 169, 107, 0.4);
        }

        /* =========================
           Mobile 361 - 599
        ========================= */

        @media (min-width: 361px) and (max-width: 599px) {

            .header {
                padding:

                    14px
                    16px;
            }

            .header-title {
                font-size: 27px;
            }

            .header-subtitle {
                font-size: 16px;
            }

            .products {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                padding: 14px;

                gap: 12px;
            }

            .product-info {
                padding: 12px;
            }

            .product-name {
                font-size: 16px;

                line-height: 1.8;
            }

            .product-description {
                font-size: 13px;

                line-height: 1.9;
            }

            .product-button {
                font-size: 14px;

                min-height: 44px;
            }
        }

        /* =========================
           Very Narrow Phones
        ========================= */

        @media (max-width: 360px) {

            .header {
                padding:
                    16px
                    10px
                    14px;
            }

            .header-title {
                font-size: 25px;
            }

            .header-subtitle {
                font-size: 15px;
            }

            .products {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                padding: 10px;

                gap: 10px;
            }

            .product-image {
                aspect-ratio: 3 / 4;
            }

            .product-info {
                padding: 10px;
            }

            .product-name {
                font-size: 14px;

                line-height: 1.7;

                margin-bottom: 8px;
            }

            .product-description {
                font-size: 12px;

                line-height: 1.8;

                margin-bottom: 10px;
            }

            .product-button {
                min-height: 42px;

                padding: 8px 4px;

                font-size: 12px;
            }
        }

        /* =========================
           Tablet
        ========================= */

        @media (min-width: 600px) {

            .products {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

                gap: 16px;

                padding: 22px;
            }

            .product-info {
                padding: 14px;
            }

            .product-name {
                font-size: 17px;
            }

            .product-description {
                font-size: 14px;
            }

            .product-button {
                font-size: 14px;
            }

            .header-title {
                font-size: 28px;
            }

            .header-subtitle {
                font-size: 17px;
            }
        }

        /* =========================
           Desktop
        ========================= */

        @media (min-width: 900px) {

            .products {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));

                gap: 18px;

                padding: 26px;
            }

            .product:hover {
                border-color: var(--accent-dark);
            }

            .product-image:hover {
                opacity: 0.94;
            }

            .product-button:hover {
                border-color: var(--accent);
            }

            .product-button.details-button:hover {
                background: #D7BA7B;
            }

            .product-button.gallery-button:hover {
                background:
                    rgba(200, 169, 107, 0.1);
            }
        }

        /* =========================
           Large Desktop
        ========================= */

        @media (min-width: 1300px) {

            .products {
                grid-template-columns:
                    repeat(5, minmax(0, 1fr));

                gap: 20px;

                padding: 30px;
            }
        }

        /* =========================
           Short Desktop Windows
        ========================= */

        @media (min-width: 700px)
            and (max-height: 650px) {

            .gallery-image {
                max-height: 52vh;
            }

            .gallery-modal {
                max-height: 90vh;
            }

            .details-modal {
                max-height: 88vh;
            }
        }
    </style>
</head>

        /* =========================
           Variables
        ========================= */

        const productsContainer =
            document.getElementById("products");

        let currentProduct = null;

        let currentImageIndex = 0;


        /* =========================
           Escape HTML
        ========================= */

        function escapeHTML(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");
        }


        /* =========================
           Render Products
        ========================= */

        function renderProducts() {

            productsContainer.innerHTML = "";

            products.forEach(product => {

                const article =
                    document.createElement("article");

                article.className = "product";


                article.innerHTML = `

                    <img
                        class="product-image"
                        src="${escapeHTML(product.images[0])}"
                        alt="${escapeHTML(product.name)}"
                        loading="lazy"
                        onclick="openGallery(${product.id})"
                    >


                    <div class="product-info">

                        <h2 class="product-name">
                            ${escapeHTML(product.name)}
                        </h2>


                        <p class="product-description">
                            ${escapeHTML(product.description)}
                        </p>


                        <div class="product-actions">

                            <button
                                class="product-button gallery-button"
                                type="button"
                                onclick="openGallery(${product.id})"
                            >
                                🖼 مشاهده تصاویر
                            </button>


                            <button
                                class="product-button details-button"
                                type="button"
                                onclick="openDetails(${product.id})"
                            >
                                ✦ جزئیات
                            </button>

                        </div>

                    </div>
                `;


                productsContainer.appendChild(article);

            });
        }


        /* =========================
           Open Gallery
        ========================= */

        function openGallery(productId) {

            currentProduct =
                products.find(
                    product =>
                        product.id === productId
                );


            if (!currentProduct) {
                return;
            }


            currentImageIndex = 0;


            document.getElementById(
                "galleryTitle"
            ).textContent =
                currentProduct.name;


            document.getElementById(
                "galleryDescription"
            ).textContent =
                currentProduct.description;


            updateGallery();


            document
                .getElementById("galleryOverlay")
                .classList.add("active");


            document.body.style.overflow =
                "hidden";
        }


        /* =========================
           Update Gallery
        ========================= */

        function updateGallery() {

            if (!currentProduct) {
                return;
            }


            const image =
                document.getElementById(
                    "galleryImage"
                );


            image.src =
                currentProduct.images[
                    currentImageIndex
                ];


            image.alt =
                currentProduct.name +
                " - تصویر " +
                (currentImageIndex + 1);


            document.getElementById(
                "galleryCounter"
            ).textContent =

                `${currentImageIndex + 1} / ${currentProduct.images.length}`;
        }


        /* =========================
           Next Image
        ========================= */

        function nextImage() {

            if (!currentProduct) {
                return;
            }


            currentImageIndex =

                (
                    currentImageIndex + 1
                ) %
                currentProduct.images.length;


            updateGallery();
        }


        /* =========================
           Previous Image
        ========================= */

        function previousImage() {

            if (!currentProduct) {
                return;
            }


            currentImageIndex =

                (
                    currentImageIndex -
                    1 +
                    currentProduct.images.length
                ) %
                currentProduct.images.length;


            updateGallery();
        }


        /* =========================
           Close Gallery
        ========================= */

        function closeGallery() {

            document
                .getElementById("galleryOverlay")
                .classList.remove("active");


            document.body.style.overflow = "";


            currentProduct = null;
        }


        /* =========================
           Open Details
        ========================= */

        function openDetails(productId) {

            const product =
                products.find(
                    item =>
                        item.id === productId
                );


            if (!product) {
                return;
            }


            document.getElementById(
                "detailsTitle"
            ).textContent =
                product.name;


            document.getElementById(
                "detailsDescription"
            ).textContent =
                product.description;


            const tableBody =
                document.getElementById(
                    "detailsTableBody"
                );


            tableBody.innerHTML = "";


            product.details.forEach(
                detail => {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    const keyCell =
                        document.createElement(
                            "td"
                        );


                    const valueCell =
                        document.createElement(
                            "td"
                        );


                    keyCell.textContent =
                        detail[0];


                    valueCell.textContent =
                        detail[1];


                    row.appendChild(
                        keyCell
                    );


                    row.appendChild(
                        valueCell
                    );


                    tableBody.appendChild(
                        row
                    );
                }
            );


            document
                .getElementById(
                    "detailsOverlay"
                )
                .classList.add("active");


            document.body.style.overflow =
                "hidden";
        }


        /* =========================
           Close Details
        ========================= */

        function closeDetails() {

            document
                .getElementById(
                    "detailsOverlay"
                )
                .classList.remove(
                    "active"
                );


            document.body.style.overflow =
                "";
        }


        /* =========================
           Overlay Click
        ========================= */

        document
            .getElementById(
                "galleryOverlay"
            )
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        this
                    ) {

                        closeGallery();

                    }

                }
            );


        document
            .getElementById(
                "detailsOverlay"
            )
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        this
                    ) {

                        closeDetails();

                    }

                }
            );


        /* =========================
           Keyboard Controls
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                const galleryIsOpen =

                    document
                        .getElementById(
                            "galleryOverlay"
                        )
                        .classList
                        .contains("active");


                const detailsIsOpen =

                    document
                        .getElementById(
                            "detailsOverlay"
                        )
                        .classList
                        .contains("active");


                /* ESC */

                if (
                    event.key ===
                    "Escape"
                ) {

                    if (galleryIsOpen) {
                        closeGallery();
                    }


                    if (detailsIsOpen) {
                        closeDetails();
                    }
                }


                /* Gallery */

                if (galleryIsOpen) {

                    if (
                        event.key ===
                        "ArrowLeft"
                    ) {

                        nextImage();

                    }


                    if (
                        event.key ===
                        "ArrowRight"
                    ) {

                        previousImage();

                    }

                }

            }
        );


        /* =========================
           Initial Render
        ========================= */

        renderProducts();

    </script>
