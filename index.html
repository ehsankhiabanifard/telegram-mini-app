    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html {
            width: 100%;
            min-height: 100%;
            background: #0B0B0D;
        }


        body {

            margin: 0;

            width: 100%;
            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                var(--bg);

            color:
                var(--text);

            overflow-x: hidden;

            -webkit-text-size-adjust: 100%;
        }


        button,
        a,
        input,
        textarea {
            font-family: inherit;
        }


        /* =========================
           DARK LUXURY THEME
        ========================= */

        :root {

            --bg: #0B0B0D;

            --surface: #151519;

            --surface-2: #1C1C21;

            --border: #292930;

            --text: #F5F5F5;

            --muted: #9999A3;

            --accent: #C8A96B;

            --accent-soft: rgba(200,169,107,.12);

            --page-max: 1400px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            width: 100%;

            padding:
                calc(20px + env(safe-area-inset-top))
                18px
                18px;

            position: sticky;

            top: 0;

            z-index: 10;

            background:
                rgba(11,11,13,.90);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            border-bottom:
                1px solid var(--border);
        }


        .brand {

            font-size: clamp(20px, 3vw, 26px);

            font-weight: 800;

            letter-spacing: -.5px;

            text-align: center;

            color:
                var(--text);

            line-height: 1.5;
        }


        .subtitle {

            margin-top: 5px;

            text-align: center;

            font-size: 12px;

            color:
                var(--muted);

            line-height: 1.7;
        }


        /* =========================
           PRODUCTS WRAPPER
        ========================= */

        .products {

            width: 100%;

            max-width:
                var(--page-max);

            margin:
                0 auto;

            padding:
                16px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 14px;
        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .product {

            min-width: 0;

            overflow: hidden;

            border-radius: 18px;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            transition:
                transform .2s ease,
                border-color .2s ease;

            display: flex;

            flex-direction: column;
        }


        .product:active {

            transform:
                scale(.985);

            border-color:
                var(--accent);
        }


        .product-image {

            width: 100%;

            aspect-ratio: 3 / 4;

            object-fit: cover;

            display: block;

            cursor: pointer;

            background:
                #101014;
        }


        .product-info {

            padding:
                12px 13px 14px;

            display: flex;

            flex-direction: column;

            flex: 1;
        }


        .product-name {

            font-size: 13px;

            font-weight: 700;

            line-height: 1.7;

            color:
                var(--text);

            margin-bottom:
                10px;

            min-height:
                22px;

            word-break: break-word;
        }


        /* =========================
           CARD BUTTONS
           VERTICAL
        ========================= */

        .product-actions {

            display: flex;

            flex-direction: column;

            gap: 8px;

            width: 100%;

            margin-top: auto;
        }


        .product-button {

            width: 100%;

            min-height: 42px;

            border: 0;

            border-radius: 10px;

            padding:
                9px 8px;

            background:
                var(--surface-2);

            border:
                1px solid var(--border);

            color:
                var(--text);

            font-family:
                inherit;

            font-size: 11px;

            line-height: 1.5;

            cursor: pointer;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .product-button:active {

            transform:
                scale(.97);
        }


        .gallery-button {

            color:
                var(--accent);
        }


        .details-button {

            background:
                var(--accent);

            color:
                #111;

            border-color:
                var(--accent);

            font-weight:
                bold;
        }


        /* =========================
           OVERLAY
        ========================= */

        .overlay {

            position: fixed;

            inset: 0;

            z-index: 100;

            background:
                rgba(0,0,0,.88);

            display: none;

            align-items: center;

            justify-content: center;

            padding:
                max(12px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));

            overflow-y: auto;

            overscroll-behavior: contain;
        }


        .overlay.active {

            display: flex;
        }


        /* =========================
           GALLERY MODAL
        ========================= */

        .gallery-modal {

            width: 100%;

            max-width: 500px;

            max-height:
                calc(100vh - 24px);

            border-radius: 24px;

            overflow: hidden;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            box-shadow:
                0 30px 100px rgba(0,0,0,.7);

            flex-shrink: 0;
        }


        .gallery {

            position: relative;

            background:
                #050506;

            overflow: hidden;
        }


        .gallery img {

            width: 100%;

            aspect-ratio: 3 / 4;

            max-height:
                76vh;

            object-fit: cover;

            display: block;
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .close {

            position: absolute;

            top: 12px;

            right: 12px;

            width: 38px;

            height: 38px;

            border:
                1px solid rgba(255,255,255,.15);

            border-radius: 50%;

            background:
                rgba(0,0,0,.65);

            color:
                white;

            font-size: 22px;

            line-height: 1;

            z-index: 5;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* =========================
           GALLERY ARROWS
        ========================= */

        .arrow {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            width: 42px;

            height: 42px;

            border:
                1px solid rgba(255,255,255,.12);

            border-radius: 50%;

            background:
                rgba(0,0,0,.65);

            color:
                white;

            font-size: 22px;

            line-height: 1;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .arrow-right {

            right: 10px;
        }


        .arrow-left {

            left: 10px;
        }


        /* =========================
           IMAGE COUNTER
        ========================= */

        .counter {

            position: absolute;

            bottom: 12px;

            left: 50%;

            transform:
                translateX(-50%);

            padding:
                5px 11px;

            border-radius:
                20px;

            background:
                rgba(0,0,0,.7);

            color:
                var(--accent);

            font-size: 11px;

            white-space: nowrap;
        }


        /* =========================
           GALLERY FOOTER
        ========================= */

        .gallery-footer {

            padding:
                14px 16px 16px;
        }


        .gallery-title {

            font-size: 17px;

            font-weight: bold;

            color:
                var(--text);

            line-height: 1.6;

            word-break: break-word;
        }


        .gallery-description {

            margin-top: 5px;

            color:
                var(--muted);

            font-size: 12px;

            line-height: 1.8;

            word-break: break-word;
        }


        /* =========================
           DETAILS MODAL
        ========================= */

        .details-modal {

            width: 100%;

            max-width: 560px;

            max-height:
                calc(100vh - 24px);

            overflow-y: auto;

            overscroll-behavior: contain;

            -webkit-overflow-scrolling: touch;

            border-radius: 24px;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            box-shadow:
                0 30px 100px rgba(0,0,0,.7);

            position: relative;

            flex-shrink: 0;
        }


        /* =========================
           DETAILS HEADER
        ========================= */

        .details-header {

            padding:
                22px 20px 18px;

            border-bottom:
                1px solid var(--border);

            position: relative;

            padding-left: 65px;
        }


        .details-label {

            font-size: 10px;

            color:
                var(--accent);

            margin-bottom:
                7px;

            letter-spacing:
                .5px;
        }


        .details-title {

            margin: 0;

            font-size: clamp(18px, 4vw, 22px);

            font-weight: 800;

            color:
                var(--text);

            line-height: 1.5;

            word-break: break-word;
        }


        .details-subtitle {

            margin-top: 7px;

            color:
                var(--muted);

            font-size: 12px;

            line-height: 1.8;

            word-break: break-word;
        }


        /* =========================
           DETAILS LIST
        ========================= */

        .details-list {

            padding:
                8px 20px 18px;
        }


        .detail-row {

            display: grid;

            grid-template-columns:
                minmax(90px, 105px)
                minmax(0, 1fr);

            gap: 12px;

            padding:
                13px 0;

            border-bottom:
                1px solid rgba(255,255,255,.06);

            line-height:
                1.8;

            align-items:
                start;
        }


        .detail-row:last-child {

            border-bottom:
                none;
        }


        .detail-key {

            color:
                var(--muted);

            font-size: 12px;

            word-break:
                break-word;
        }


        .detail-value {

            color:
                var(--text);

            font-size: 13px;

            font-weight:
                600;

            word-break:
                break-word;

            min-width: 0;
        }


        /* =========================
           DETAILS ACTIONS
        ========================= */

        .details-actions {

            padding:
                0 20px 20px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
        }


        .details-action {

            min-width: 0;

            min-height: 46px;

            padding:
                13px 8px;

            border-radius:
                14px;

            text-align:
                center;

            text-decoration:
                none;

            font-family:
                inherit;

            font-size:
                12px;

            font-weight:
                bold;

            line-height:
                1.5;

            color:
                var(--text);

            background:
                var(--surface-2);

            border:
                1px solid var(--border);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;
        }


        .details-action.map {

            grid-column:
                1 / -1;

            background:
                var(--accent);

            color:
                #111;

            border-color:
                var(--accent);
        }


        /* =========================
           TABLET
        ========================= */

        @media (min-width: 600px) {

            .products {

                gap: 16px;

                padding:

            }


            .product-info {

                padding:

            }


            .product-name {

                font-size: 14px;
            }


            .product-button {

                font-size: 11px;

                min-height: 44px;
            }

        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 900px) {

            .header {

                padding-left:
                    30px;

                padding-right:
                    30px;
            }


            .products {

                grid-template-columns:
                    repeat(4, minmax(0, 1fr));

                gap: 18px;

                padding:
                    24px;
            }


            .product {

                border-radius:
                    20px;
            }


            .product-button:hover {

                border-color:
                    var(--accent);
            }


            .details-modal {

                max-width:
                    600px;
            }


            .gallery-modal {

                max-width:
                    520px;
            }

        }


        /* =========================
           LARGE DESKTOP
        ========================= */

        @media (min-width: 1300px) {

            .products {

                grid-template-columns:
                    repeat(5, minmax(0, 1fr));

                gap: 20px;

                padding:

            }

        }




        /* =========================
           SHORT DESKTOP WINDOWS
        ========================= */

        @media (min-width: 700px) and (max-height: 650px) {

            .overlay {

                align-items:
                    flex-start;

                padding-top:
                    12px;

                padding-bottom:
                    12px;
            }


            .gallery-modal,
            .details-modal {

                max-height:
                    calc(100vh - 24px);
            }


            .gallery img {

                max-height:
                    60vh;
            }

        }

        /* =========================
           ELEMENTS
        ========================= */

        const productsContainer =
            document.getElementById(
                "products"
            );


        const galleryOverlay =
            document.getElementById(
                "galleryOverlay"
            );


        const detailsOverlay =
            document.getElementById(
                "detailsOverlay"
            );


        const galleryImage =
            document.getElementById(
                "galleryImage"
            );


        const galleryTitle =
            document.getElementById(
                "galleryTitle"
            );


        const galleryDescription =
            document.getElementById(
                "galleryDescription"
            );


        const counter =
            document.getElementById(
                "counter"
            );


        const detailsTitle =
            document.getElementById(
                "detailsTitle"
            );


        const detailsSubtitle =
            document.getElementById(
                "detailsSubtitle"
            );


        const detailsList =
            document.getElementById(
                "detailsList"
            );



        /* =========================
           RENDER PRODUCTS
        ========================= */

        products.forEach(
            (product, index) => {


                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "product";


                card.innerHTML = `

                    <img
                        class="product-image"
                        src="${product.images[0]}"
                        alt="${product.name}"
                        loading="lazy"
                        onclick="openGallery(${index})">


                    <div class="product-info">


                        <div class="product-name">

                            ${product.name}

                        </div>


                        <div class="product-actions">


                            <button
                                type="button"
                                class="product-button gallery-button"
                                onclick="openGallery(${index})">

                                🖼 مشاهده تصاویر

                            </button>


                            <button
                                type="button"
                                class="product-button details-button"
                                onclick="openDetails(${index})">

                                ✦ جزئیات

                            </button>


                        </div>


                    </div>

                `;


                productsContainer.appendChild(
                    card
                );

            }
        );



        /* =========================
           GALLERY VARIABLES
        ========================= */

        let currentProduct = 0;

        let currentImage = 0;



        /* =========================
           OPEN GALLERY
        ========================= */

        function openGallery(index) {

            currentProduct =
                index;

            currentImage =
                0;

            updateGallery();

            galleryOverlay.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";

        }



        /* =========================
           UPDATE GALLERY
        ========================= */

        function updateGallery() {

            const product =
                products[
                    currentProduct
                ];


            galleryImage.src =
                product.images[
                    currentImage
                ];


            galleryTitle.textContent =
                product.name;


            galleryDescription.textContent =
                product.description;


            counter.textContent =
                `${currentImage + 1} / ${product.images.length}`;

        }



        /* =========================
           NEXT IMAGE
        ========================= */

        function nextImage() {

            const product =
                products[
                    currentProduct
                ];


            currentImage++;


            if (
                currentImage >=
                product.images.length
            ) {

                currentImage = 0;

            }


            updateGallery();

        }



        /* =========================
           PREVIOUS IMAGE
        ========================= */

        function previousImage() {

            const product =
                products[
                    currentProduct
                ];


            currentImage--;


            if (
                currentImage < 0
            ) {

                currentImage =
                    product.images.length - 1;

            }


            updateGallery();

        }



        /* =========================
           CLOSE GALLERY
        ========================= */

        function closeGallery() {

            galleryOverlay.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

        }



        /* =========================
           OPEN DETAILS
        ========================= */

        function openDetails(index) {

            const product =
                products[index];


            detailsTitle.textContent =
                product.name;


            detailsSubtitle.textContent =
                product.description;


            detailsList.innerHTML =
                "";


            product.details.forEach(
                item => {


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "detail-row";


                    row.innerHTML = `

                        <div class="detail-key">

                            ${item[0]}

                        </div>


                        <div class="detail-value">

                            ${item[1]}

                        </div>

                    `;


                    detailsList.appendChild(
                        row
                    );

                }
            );


            detailsOverlay.classList.add(
                "active"
            );


            document.body.style.overflow =
                "hidden";

        }



        /* =========================
           CLOSE DETAILS
        ========================= */

        function closeDetails() {

            detailsOverlay.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

        }



        /* =========================
           CLOSE OVERLAYS BY BACKGROUND
        ========================= */

        galleryOverlay.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    galleryOverlay
                ) {

                    closeGallery();

                }

            }
        );


        detailsOverlay.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    detailsOverlay
                ) {

                    closeDetails();

                }

            }
        );


        /* =========================
           ESC KEY - DESKTOP
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    if (
                        galleryOverlay.classList.contains("active")
                    ) {

                        closeGallery();

                    }


                    if (
                        detailsOverlay.classList.contains("active")
                    ) {

                        closeDetails();

                    }

                }


                if (
                    galleryOverlay.classList.contains("active")
                ) {

                    if (
                        event.key === "ArrowRight"
                    ) {

                        nextImage();

                    }


                    if (
                        event.key === "ArrowLeft"
                    ) {

                        previousImage();

                    }

                }

            }
        );


    </script>
